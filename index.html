<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ResearchMind — AI Research Synthesis Platform</title>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
  :root{
    --bg:#FAFAF8; --purple:#534AB7; --purple-light:#EEF2FF; --indigo:#1E1B4B;
    --mid-purple:#818CF8; --green:#059669; --green-bg:#D1FAE5; --amber:#D97706;
    --amber-bg:#FEF3C7; --red:#DC2626; --red-bg:#FEE2E2; --blue:#1D4ED8; --blue-bg:#DBEAFE;
    --text-dark:#111827; --text-body:#374151; --text-muted:#6B7280; --border:#E5E7EB;
    --card-bg:#FFFFFF; --surface:#F9FAFB;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg); color:var(--text-body);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    min-width:1200px;
  }
  #root{min-height:100vh;}
  button{font-family:inherit; cursor:pointer;}
  input,textarea,select{font-family:inherit; font-size:13px;}
  .card{
    background:var(--card-bg); border:1px solid var(--border); border-radius:10px;
    box-shadow:0 1px 2px rgba(0,0,0,0.04); padding:20px;
  }
  .btn{
    border-radius:8px; padding:9px 16px; font-size:13px; font-weight:600;
    border:1px solid transparent; transition:background .15s,border-color .15s,color .15s;
  }
  .btn-purple{ background:var(--purple); color:#fff; }
  .btn-purple:hover{ background:#453da0; }
  .btn-purple:disabled{ background:#a7a1d6; cursor:not-allowed; }
  .btn-outline{ background:#fff; color:var(--purple); border-color:var(--purple); }
  .btn-outline:hover{ background:var(--purple-light); }
  .btn-ghost{ background:transparent; color:var(--text-muted); border-color:var(--border); }
  .btn-ghost:hover{ background:var(--surface); }
  .btn-green{ background:var(--green); color:#fff; }
  .btn-green:hover{ background:#047857; }
  .btn-sm{ padding:5px 10px; font-size:12px; border-radius:6px; }
  .badge{
    display:inline-flex; align-items:center; gap:4px; padding:2px 8px; border-radius:20px;
    font-size:11px; font-weight:600;
  }
  .spinner{
    width:40px; height:40px; border-radius:50%; border:3px solid #EEF2FF;
    border-top:3px solid var(--purple); animation:spin 0.8s linear infinite; margin:0 auto;
  }
  .spinner-sm{
    width:14px; height:14px; border-radius:50%; border:2px solid rgba(255,255,255,0.4);
    border-top:2px solid #fff; animation:spin 0.7s linear infinite; display:inline-block;
    vertical-align:middle; margin-right:6px;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  .fade-in{ animation:fadeIn .25s ease; }
  @keyframes fadeIn{ from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:translateY(0);} }
  .collapse-body{ overflow:hidden; transition:max-height .2s ease; }
  ::placeholder{ color:#9CA3AF; }
  textarea, input[type=text]{
    border:1px solid var(--border); border-radius:8px; padding:8px 10px; outline:none;
    color:var(--text-dark);
  }
  textarea:focus, input[type=text]:focus{ border-color:var(--purple); box-shadow:0 0 0 3px rgba(83,74,183,0.1); }
  a{ color:var(--purple); cursor:pointer; }
  .clamp2{
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
  }
  .tab-btn{
    background:none; border:none; padding:14px 4px; font-size:14px; font-weight:600;
    color:var(--text-muted); border-bottom:2px solid transparent; margin-right:28px;
  }
  .tab-btn.active{ color:var(--purple); border-bottom-color:var(--purple); }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/plain" id="app-source">
const { useState, useEffect, useRef, useMemo } = React;

/* ---------------------------------- DATA ---------------------------------- */

const INITIAL_TRANSCRIPTS = [
  { id: "P01", label: "Junior Researcher, Design Agency", reviewed: false,
    text: "After fieldwork we have 40 interviews to transcribe manually. AI tools make too many errors so we do it by hand. Then I read each transcript again just to highlight things. By the time I get to grouping observations I am already exhausted. My manager keeps asking for updates but I cannot give them because I am still in the data. I have worked until midnight multiple times just to finish synthesis before a client presentation." },
  { id: "P02", label: "Senior UX Researcher, Tech Company", reviewed: false,
    text: "The most frustrating thing is that I can feel the insight is in there somewhere but I cannot reach it in time. The client wants deliverables in three days but synthesis is supposed to take a week. So we cut corners. The insights end up being things the client already knew. I have had presentations fall flat because the findings were not surprising. I knew when I was putting the deck together that it was not strong enough but there was nothing I could do. We were out of time." },
  { id: "P03", label: "Research Lead, Consultancy", reviewed: false,
    text: "Managing the team through synthesis is the hardest part of my job. People burn out fast. I have had researchers quit specifically because of the synthesis workload. We use Miro for affinity mapping but when you have 500 sticky notes it becomes chaotic. Nobody can see the whole picture. Different researchers interpret the same data differently so our buckets do not match. I also worry about data privacy because we are putting client recordings into third party tools." },
  { id: "P04", label: "Product Researcher, Consumer Electronics", reviewed: false,
    text: "We work across multiple languages because we research in different markets. So we have to translate and transcribe which doubles the time. I often feel like we are delivering insights that are already outdated by the time we finish synthesis. The product teams have moved on. The decisions have been made. Our research ends up on a shelf. What I really want is to get to insights faster so I can actually influence the product direction before it is too late." },
  { id: "P05", label: "UX Researcher, Startup", reviewed: false,
    text: "At a startup I do all the research myself and also write the PRD and talk to engineering. So synthesis has to be fast. I have tried using AI summaries but they miss the nuance. They give me generic outputs that could apply to anyone. What I need is something that understands the context of what I am researching not just the words. And I need to trust the output because my product decisions are based on it." }
];

const LOADING_MESSAGES = [
  "Reading all {N} transcripts simultaneously...",
  "Identifying semantic patterns across participants...",
  "Clustering observations by meaning — not just words...",
  "Calculating confidence scores for each bucket...",
  "Preparing evidence traceability..."
];

const FLAG_META = {
  critical:  { label: "Critical",   dot: "#DC2626" },
  noteworthy:{ label: "Noteworthy", dot: "#D97706" },
  unique:    { label: "Unique",     dot: "#1D4ED8" },
  standard:  { label: "Standard",   dot: "#9CA3AF" }
};

const CONFIDENCE_META = {
  high:   { label: "High",   bg: "#D1FAE5", color: "#059669" },
  medium: { label: "Medium", bg: "#FEF3C7", color: "#D97706" },
  low:    { label: "Low",    bg: "#FEE2E2", color: "#DC2626" }
};

const INSIGHT_TYPE_META = {
  pattern:     { label: "Pattern",     bg: "#DBEAFE", color: "#1D4ED8" },
  tension:     { label: "Tension",     bg: "#FEF3C7", color: "#D97706" },
  opportunity: { label: "Opportunity", bg: "#D1FAE5", color: "#059669" },
  risk:        { label: "Risk",        bg: "#FEE2E2", color: "#DC2626" }
};

function wordCount(text){
  return (text || "").trim().split(/\s+/).filter(Boolean).length;
}

function uid(){ return Math.random().toString(36).slice(2, 10); }

function normalizeInsights(list){
  return (list || []).map(i => ({
    id: uid(), insight: i.insight || "", evidence: i.evidence || "", type: i.type || "pattern"
  }));
}

function normalizeSynthesis(result){
  const out = {
    summary: result.summary || "",
    buckets: (result.buckets || []).map(b => ({
      id: uid(),
      name: b.name || "Untitled bucket",
      insight: b.insight || "",
      confidence: b.confidence || "medium",
      observations: (b.observations || []).map(o => ({
        id: uid(),
        participantId: o.participantId || "?",
        observation: o.observation || "",
        flag: o.flag || "standard"
      }))
    })),
    unclassified: (result.unclassified || []).map(o => ({
      id: uid(), participantId: o.participantId || "?", observation: o.observation || "", reason: o.reason || ""
    })),
    strategicInsights: normalizeInsights(result.strategicInsights)
  };
  return out;
}

/* ------------------------- DEMO DATA (no API key) -------------------------- */
/* A pre-baked, realistic synthesis of the 5 default transcripts, so anyone can
   try the full product experience instantly without an Anthropic API key. */

const DEMO_RESULT_RAW = {
  summary: "Across all five researchers, synthesis — not fieldwork — is the primary bottleneck, driving compressed timelines, generic insights, and team burnout.",
  buckets: [
    {
      name: "Time Pressure Undermines Quality",
      insight: "Compressed synthesis timelines force researchers to cut corners, directly lowering the quality of what gets delivered.",
      confidence: "high",
      observations: [
        { participantId: "P01", observation: "Worked until midnight multiple times just to finish synthesis before a client presentation.", flag: "critical" },
        { participantId: "P02", observation: "Client wants deliverables in three days but synthesis is supposed to take a week.", flag: "critical" },
        { participantId: "P04", observation: "Insights are already outdated by the time synthesis finishes and decisions have been made.", flag: "noteworthy" }
      ]
    },
    {
      name: "Manual Tools Don't Scale",
      insight: "Affinity mapping and manual transcription break down once interview volume gets large, creating chaos instead of clarity.",
      confidence: "high",
      observations: [
        { participantId: "P01", observation: "Transcribes 40 interviews by hand because AI tools make too many errors.", flag: "noteworthy" },
        { participantId: "P03", observation: "500 sticky notes on Miro becomes chaotic — nobody can see the whole picture.", flag: "critical" },
        { participantId: "P03", observation: "Different researchers interpret the same data differently, so buckets do not match.", flag: "noteworthy" }
      ]
    },
    {
      name: "Synthesis Workload Drives Burnout",
      insight: "The grouping and pattern-finding stage, not the interviewing itself, is what exhausts researchers and pushes some to quit.",
      confidence: "medium",
      observations: [
        { participantId: "P03", observation: "Researchers have quit specifically because of the synthesis workload.", flag: "critical" },
        { participantId: "P01", observation: "By the time grouping starts, I am already exhausted from re-reading transcripts.", flag: "noteworthy" },
        { participantId: "P02", observation: "Knew the deck wasn't strong enough but there was nothing I could do — out of time.", flag: "noteworthy" }
      ]
    },
    {
      name: "Research Loses Strategic Relevance",
      insight: "By the time synthesis completes, decisions are often already made — research arrives too late to shape direction.",
      confidence: "high",
      observations: [
        { participantId: "P02", observation: "Insights end up being things the client already knew; presentations fall flat.", flag: "critical" },
        { participantId: "P04", observation: "Research ends up on a shelf because product teams have already moved on.", flag: "critical" }
      ]
    },
    {
      name: "Generic AI Output Fails to Earn Trust",
      insight: "Off-the-shelf AI summarization misses nuance and produces generic output, so researchers don't trust it for real decisions.",
      confidence: "medium",
      observations: [
        { participantId: "P05", observation: "AI summaries miss the nuance and give generic outputs that could apply to anyone.", flag: "unique" },
        { participantId: "P05", observation: "Needs to trust the output because product decisions are based on it.", flag: "critical" }
      ]
    },
    {
      name: "Data Privacy in Third-Party Tools",
      insight: "Putting client recordings into third-party synthesis tools raises unresolved data privacy concerns for research leads.",
      confidence: "low",
      observations: [
        { participantId: "P03", observation: "Worried about data privacy from putting client recordings into third party tools.", flag: "unique" }
      ]
    }
  ],
  unclassified: [
    { participantId: "P05", observation: "Does all the research personally and also writes the PRD and talks to engineering.", reason: "Describes role context rather than a specific synthesis pain point." }
  ],
  strategicInsights: [
    {
      insight: "Researchers face a structural tension: synthesis needs about a week of deep work, but delivery pressure regularly compresses it to under three days.",
      evidence: "P01 and P02 both describe working past midnight or cutting corners under near-identical timeline pressure.",
      type: "tension"
    },
    {
      insight: "Manual, tool-fragmented synthesis workflows are creating a burnout-driven retention risk for research teams.",
      evidence: "P01, P02, and P03 all describe exhaustion or attrition tied directly to the synthesis stage, not fieldwork.",
      type: "risk"
    },
    {
      insight: "Faster, context-aware synthesis could let research re-enter decisions before roadmaps are locked, instead of arriving after the fact.",
      evidence: "P04 and P05 both point to research being sidelined because it is either too slow or too generic to act on in time.",
      type: "opportunity"
    }
  ]
};

/* ------------------------------- SMALL PARTS ------------------------------- */

function FlagDot({flag}){
  const m = FLAG_META[flag] || FLAG_META.standard;
  return <span style={{display:"inline-block", width:7, height:7, borderRadius:"50%", background:m.dot, marginRight:5}}></span>;
}

function ConfidenceBadge({level}){
  const m = CONFIDENCE_META[level] || CONFIDENCE_META.medium;
  return (
    <span className="badge" style={{background:m.bg, color:m.color}}>
      <span style={{display:"inline-block", width:6, height:6, borderRadius:"50%", background:m.color}}></span>
      {m.label}
    </span>
  );
}

function ParticipantBadge({id, onClick}){
  return (
    <span onClick={onClick} className="badge" style={{
      background:"var(--purple)", color:"#fff", cursor:onClick?"pointer":"default", fontWeight:700
    }}>{id}</span>
  );
}

/* ================================================================== */
/*                              APP ROOT                                */
/* ================================================================== */

function App(){
  const [mode, setMode] = useState("demo"); // "demo" (no key needed) | "live" (real API)
  const [apiKey, setApiKey] = useState("");
  const [apiKeyInput, setApiKeyInput] = useState("");
  const [apiKeySet, setApiKeySet] = useState(false);

  const [transcripts, setTranscripts] = useState(INITIAL_TRANSCRIPTS.map(t => ({...t, id: t.id})));
  const [activeTab, setActiveTab] = useState("transcripts");

  const [loadingState, setLoadingState] = useState("idle"); // idle | loading | done | error
  const [errorMsg, setErrorMsg] = useState("");
  const [rawDebug, setRawDebug] = useState("");
  const [synthesisResult, setSynthesisResult] = useState(null);

  const [bucketApprovals, setBucketApprovals] = useState({});
  const [acceptedInsights, setAcceptedInsights] = useState({});
  const [dismissedInsights, setDismissedInsights] = useState({});

  const [insightLoadingState, setInsightLoadingState] = useState("idle"); // idle | loading | done | error
  const [insightError, setInsightError] = useState("");

  const [highlightParticipant, setHighlightParticipant] = useState(null);

  function handleSetKey(){
    if(apiKeyInput.trim()){
      setApiKey(apiKeyInput.trim());
      setApiKeySet(true);
    }
  }
  function handleChangeKey(){
    setApiKeySet(false);
    setApiKeyInput(apiKey);
  }

  async function runSynthesis(){
    setActiveTab("bucketing");
    setLoadingState("loading");
    setErrorMsg("");
    setSynthesisResult(null);
    setBucketApprovals({});
    setAcceptedInsights({});
    setDismissedInsights({});
    setInsightLoadingState("idle");
    setInsightError("");

    if(mode === "demo"){
      // Simulate the same timing as a real call so the loading experience feels authentic,
      // then load the pre-baked demo buckets — no API key or network call required.
      // Strategic insights are intentionally withheld here: they only get generated once
      // the researcher explicitly approves buckets and clicks "Generate Strategic Insights".
      setTimeout(() => {
        const normalized = normalizeSynthesis(DEMO_RESULT_RAW);
        normalized.strategicInsights = [];
        setSynthesisResult(normalized);
        setLoadingState("done");
      }, 3400);
      return;
    }

    if(!apiKeySet || !apiKey){
      setLoadingState("error");
      setErrorMsg("No API key set. Please set your Anthropic API key in the bar at the top, or switch to Demo Mode to try it without a key.");
      return;
    }

    try{
      const response = await fetch("https://api.anthropic.com/v1/messages", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "x-api-key": apiKey,
          "anthropic-version": "2023-06-01",
          "anthropic-dangerous-direct-browser-access": "true"
        },
        body: JSON.stringify({
          model: "claude-haiku-4-5",
          max_tokens: 3000,
          system: `You are ResearchMind's AI synthesis engine for qualitative research teams. Analyse interview transcripts and cluster observations into semantic buckets. Group similar insights even when participants used completely different words to describe the same experience.
Return ONLY a valid JSON object. No markdown, no explanation, no code fences. Start with { end with }.
Structure:
{
  "summary": "one sentence describing the dominant pattern across all transcripts",
  "buckets": [
    {
      "name": "3-5 word descriptive bucket name",
      "insight": "one strategic insight this bucket reveals, under 25 words",
      "confidence": "high or medium or low",
      "observations": [
        {
          "participantId": "P01",
          "observation": "specific thing this participant said about this theme, under 25 words",
          "flag": "critical or noteworthy or unique or standard"
        }
      ]
    }
  ],
  "unclassified": [
    {
      "participantId": "P01",
      "observation": "observation text",
      "reason": "why this did not fit clearly into any bucket"
    }
  ]
}
Rules:
- Create 4-6 buckets
- Each bucket should have 2-4 observations
- Flag observations: critical = appears in 3+ participants or has high strategic weight; noteworthy = appears in 2 participants; unique = only one participant; standard = regular observation
- Do NOT generate strategic insights in this step — that happens later, only after the researcher has reviewed and approved these buckets
- All text must be concise and specific to the actual transcript content`,
          messages: [{
            role: "user",
            content: `Analyse these ${transcripts.length} research interview transcripts and return the JSON synthesis:\n\n${transcripts.map(t => `[${t.id}] ${t.label}\n"${t.text}"`).join('\n\n---\n\n')}`
          }]
        })
      });

      const data = await response.json();

      if(!response.ok){
        const msg = (data && data.error && data.error.message) ? data.error.message : `HTTP ${response.status}`;
        throw new Error(msg);
      }

      let raw = data.content[0].text;
      setRawDebug(raw);
      raw = raw.replace(/```json/g, '').replace(/```/g, '').trim();
      const result = JSON.parse(raw);

      const normalized = normalizeSynthesis(result);
      normalized.strategicInsights = [];
      setSynthesisResult(normalized);
      setLoadingState("done");
    } catch(err){
      setLoadingState("error");
      setErrorMsg(err.message || String(err));
    }
  }

  async function generateInsights(){
    if(!synthesisResult || synthesisResult.buckets.length === 0) return;
    const allApproved = synthesisResult.buckets.every(b => bucketApprovals[b.id]);
    if(!allApproved) return; // guarded in the UI too — insights only ever generate on explicit click after full approval

    setInsightLoadingState("loading");
    setInsightError("");

    if(mode === "demo"){
      setTimeout(() => {
        const insights = normalizeInsights(DEMO_RESULT_RAW.strategicInsights);
        setSynthesisResult(prev => ({...prev, strategicInsights: insights}));
        setInsightLoadingState("done");
        setActiveTab("insights");
      }, 1800);
      return;
    }

    if(!apiKeySet || !apiKey){
      setInsightLoadingState("error");
      setInsightError("No API key set. Please set your Anthropic API key in the bar at the top, or switch to Demo Mode.");
      return;
    }

    try{
      const bucketSummary = synthesisResult.buckets.map(b =>
        `Bucket: ${b.name}\nBucket insight: ${b.insight}\nConfidence: ${b.confidence}\nObservations:\n${b.observations.map(o => `- [${o.participantId}] ${o.observation} (flag: ${o.flag})`).join('\n')}`
      ).join('\n\n---\n\n');

      const response = await fetch("https://api.anthropic.com/v1/messages", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "x-api-key": apiKey,
          "anthropic-version": "2023-06-01",
          "anthropic-dangerous-direct-browser-access": "true"
        },
        body: JSON.stringify({
          model: "claude-haiku-4-5",
          max_tokens: 1500,
          system: `You are ResearchMind's AI insight engine. The researcher has already reviewed, edited, and approved the observation buckets below. Your job is to find non-obvious, strategic patterns that emerge ACROSS these approved buckets — not to repeat any single bucket's insight.
Return ONLY a valid JSON object. No markdown, no explanation, no code fences. Start with { end with }.
Structure:
{
  "strategicInsights": [
    {
      "insight": "non-obvious pattern that emerges across multiple buckets, under 30 words",
      "evidence": "which participants support this and the connection between them",
      "type": "pattern or tension or opportunity or risk"
    }
  ]
}
Rules:
- Generate exactly 3 strategic insights
- Each insight must draw a connection across at least two different buckets
- All text must be concise and specific to the actual bucket content provided`,
          messages: [{
            role: "user",
            content: `Here are the researcher-approved buckets. Generate the strategic insights JSON:\n\n${bucketSummary}`
          }]
        })
      });

      const data = await response.json();
      if(!response.ok){
        const msg = (data && data.error && data.error.message) ? data.error.message : `HTTP ${response.status}`;
        throw new Error(msg);
      }

      let raw = data.content[0].text;
      raw = raw.replace(/```json/g, '').replace(/```/g, '').trim();
      const result = JSON.parse(raw);
      const insights = normalizeInsights(result.strategicInsights);

      setSynthesisResult(prev => ({...prev, strategicInsights: insights}));
      setInsightLoadingState("done");
      setActiveTab("insights");
    } catch(err){
      setInsightLoadingState("error");
      setInsightError(err.message || String(err));
    }
  }

  return (
    <div>
      <ApiKeyBar
        mode={mode}
        setMode={setMode}
        apiKeySet={apiKeySet}
        apiKeyInput={apiKeyInput}
        setApiKeyInput={setApiKeyInput}
        onSetKey={handleSetKey}
        onChangeKey={handleChangeKey}
      />
      <Header />
      <TabsBar
        activeTab={activeTab}
        setActiveTab={setActiveTab}
        transcriptCount={transcripts.length}
        bucketCount={synthesisResult ? synthesisResult.buckets.length : 0}
        insightsReady={!!(synthesisResult && synthesisResult.strategicInsights.length > 0)}
      />

      <div style={{maxWidth:1200, margin:"0 auto", padding:"24px 32px 64px"}}>
        {activeTab === "transcripts" && (
          <TranscriptsTab
            mode={mode}
            transcripts={transcripts}
            setTranscripts={setTranscripts}
            onRunSynthesis={runSynthesis}
          />
        )}
        {activeTab === "bucketing" && (
          <BucketingTab
            mode={mode}
            loadingState={loadingState}
            errorMsg={errorMsg}
            rawDebug={rawDebug}
            synthesisResult={synthesisResult}
            setSynthesisResult={setSynthesisResult}
            transcripts={transcripts}
            bucketApprovals={bucketApprovals}
            setBucketApprovals={setBucketApprovals}
            onGoToTranscripts={() => setActiveTab("transcripts")}
            onRerun={runSynthesis}
            highlightParticipant={highlightParticipant}
            setHighlightParticipant={setHighlightParticipant}
            onGenerateInsights={generateInsights}
            insightLoadingState={insightLoadingState}
            insightError={insightError}
          />
        )}
        {activeTab === "insights" && (
          <InsightsTab
            synthesisResult={synthesisResult}
            transcripts={transcripts}
            acceptedInsights={acceptedInsights}
            setAcceptedInsights={setAcceptedInsights}
            dismissedInsights={dismissedInsights}
            setDismissedInsights={setDismissedInsights}
            setActiveTab={setActiveTab}
            setHighlightParticipant={setHighlightParticipant}
            bucketApprovals={bucketApprovals}
            onGenerateInsights={generateInsights}
            insightLoadingState={insightLoadingState}
            insightError={insightError}
          />
        )}
      </div>
    </div>
  );
}

/* ================================================================== */
/*                             API KEY BAR                             */
/* ================================================================== */

function ApiKeyBar({mode, setMode, apiKeySet, apiKeyInput, setApiKeyInput, onSetKey, onChangeKey}){
  return (
    <div style={{
      background:"#F9FAFB", borderBottom:"1px solid var(--border)", padding:"8px 32px",
      display:"flex", alignItems:"center", justifyContent:"space-between", flexWrap:"wrap", gap:8
    }}>
      <span style={{color:"var(--text-muted)", fontSize:12}}>
        ResearchMind · {mode === "demo" ? "Sample Data Demo" : "Real Claude API Synthesis"}
      </span>

function AddTranscriptPanel({transcripts, setTranscripts}){
  const [format, setFormat] = useState("audio");
  const [participantId, setParticipantId] = useState("");
  const [label, setLabel] = useState("");
  const [text, setText] = useState("");

  const [audioFile, setAudioFile] = useState(null);
  const [transcribing, setTranscribing] = useState(false);

  // pdf/doc state
  const [docFile, setDocFile] = useState(null);
  const [processingDoc, setProcessingDoc] = useState(false);

  function resetForm(){
    setParticipantId(""); setLabel(""); setText("");
    setAudioFile(null); setDocFile(null);
  }

  function addTranscript(newText){
    if(!participantId.trim() || !label.trim() || !newText.trim()) return;
    setTranscripts([...transcripts, { id: participantId.trim(), label: label.trim(), text: newText.trim(), reviewed: false }]);
    resetForm();

    if(!file) return;
    setAudioFile(file);
  }

    setTranscribing(true);
    setTimeout(() => {
      const simulated = `This transcript was uploaded from ${audioFile.name}. In production, OpenAI Whisper would transcribe this audio file with word-level confidence scores. Low-confidence segments would be flagged in amber for researcher review. The transcript would then flow into the semantic bucketing pipeline.`;
      setTranscribing(false);
      setText(simulated);
    }, 3000);
  }

  function handleDocSelect(file){
    if(!file) return;
    setDocFile(file);
    setProcessingDoc(true);
    setTimeout(() => {
      setProcessingDoc(false);
      setText(`Document content from ${file.name} would appear here. In production, the document would be parsed and the text extracted for analysis.`);

    { key: "audio", icon: "🎤", label: "Audio/Video" },
    { key: "pdf", icon: "📄", label: "PDF / Document" },
    { key: "paste", icon: "📋", label: "Paste Text" },

      </div>

      {format === "audio" && (
        <div>
          <label style={{
            display:"block", border:"2px dashed var(--border)", borderRadius:10, padding:"28px 16px",
            textAlign:"center", cursor:"pointer", background:"var(--surface)"
          }}>
            <input type="file" accept="audio/*,video/*" style={{display:"none"}}
              onChange={e => handleAudioSelect(e.target.files[0])} />
            <div style={{fontSize:14, color:"var(--text-body)", fontWeight:600}}>
              {audioFile ? `Selected: ${audioFile.name}` : "Drop audio or video file here or click to browse"}
            </div>
            <div style={{fontSize:11, color:"var(--text-muted)", marginTop:4}}>MP3, MP4, WAV, MOV, M4A</div>
          </label>

          <div style={{background:"var(--amber-bg)", border:"1px solid #FDE68A", borderRadius:8, padding:"10px 12px", marginTop:12, fontSize:12, color:"#92400E"}}>
            ⚠ Transcription simulation mode — Audio/video transcription requires Whisper API integration (not included in this prototype). Upload will simulate the transcription process with a realistic placeholder to demonstrate the workflow.
          </div>

          {audioFile && !text && (
            <button className="btn btn-purple" style={{marginTop:12}} onClick={simulateTranscription} disabled={transcribing}>
              {transcribing && <span className="spinner-sm"></span>}
              {transcribing ? "Transcribing audio..." : "Simulate Transcription"}
            </button>
          )}

          {text && (
            <div style={{marginTop:14}}>
              <div style={{display:"flex", gap:10, marginBottom:8}}>
                <input type="text" placeholder="Participant ID e.g. P06" value={participantId} onChange={e => setParticipantId(e.target.value)} style={{flex:1}} />
                <input type="text" placeholder="Label e.g. Senior Designer" value={label} onChange={e => setLabel(e.target.value)} style={{flex:2}} />
              </div>
              <textarea rows={4} value={text} onChange={e => setText(e.target.value)} style={{width:"100%"}}></textarea>
              <button className="btn btn-purple" style={{marginTop:10}} onClick={() => addTranscript(text)}>Add Transcript</button>
            </div>

      {format === "pdf" && (
        <div>

            display:"block", border:"2px dashed var(--border)", borderRadius:10, padding:"28px 16px",

      {(format === "paste" || format === "type") && (
        <div>
          <div style={{display:"flex", gap:10, marginBottom:10}}>
            <div style={{flex:1}}>
              <div style={{fontSize:11, color:"var(--text-muted)", marginBottom:4}}>Participant ID</div>
              <input type="text" placeholder="e.g. P06" value={participantId} onChange={e => setParticipantId(e.target.value)} style={{width:"100%"}} />
            </div>
            <div style={{flex:2}}>
              <div style={{fontSize:11, color:"var(--text-muted)", marginBottom:4}}>Participant Label</div>
              <input type="text" placeholder="e.g. Senior Designer, FinTech Company" value={label} onChange={e => setLabel(e.target.value)} style={{width:"100%"}} />
            </div>
          </div>
          <div style={{fontSize:11, color:"var(--text-muted)", marginBottom:4}}>Transcript Text</div>
          <textarea rows={8} placeholder="Paste or type the interview transcript here..." value={text} onChange={e => setText(e.target.value)} style={{width:"100%"}}></textarea>
          <button className="btn btn-purple" style={{marginTop:10}} onClick={() => addTranscript(text)}>Add Transcript</button>
        </div>
      )}
    </div>
  );
}

function TranscriptListSection({transcripts, setTranscripts}){
  const [expandedId, setExpandedId] = useState(null);

  function updateTranscript(idx, patch){
    const copy = transcripts.slice();
    copy[idx] = {...copy[idx], ...patch};
    setTranscripts(copy);
  }
  function removeTranscript(idx){
    setTranscripts(transcripts.filter((_, i) => i !== idx));
  }

  return (
    <div style={{marginBottom:8}}>
      <div style={{display:"flex", alignItems:"baseline", justifyContent:"space-between"}}>
        <div style={{fontWeight:700, fontSize:16, color:"var(--text-dark)"}}>Research Transcripts <span style={{color:"var(--text-muted)", fontWeight:400, fontSize:13}}>({transcripts.length})</span></div>
        <div style={{color:"var(--text-muted)", fontSize:12}}>Click any transcript to expand and edit</div>
      </div>

      <div style={{display:"flex", flexDirection:"column", gap:10, marginTop:12}}>
        {transcripts.map((t, idx) => (
          <TranscriptCard key={t.id + idx} transcript={t}
            expanded={expandedId === (t.id + idx)}
            onToggle={() => setExpandedId(expandedId === (t.id + idx) ? null : (t.id + idx))}
            onChange={patch => updateTranscript(idx, patch)}
            onRemove={() => removeTranscript(idx)} />
        ))}
        {transcripts.length === 0 && (
          <div className="card" style={{textAlign:"center", color:"var(--text-muted)", padding:32}}>
            No transcripts yet. Add one above.
          </div>
        )}
      </div>
    </div>
  );
}

function TranscriptCard({transcript, expanded, onToggle, onChange, onRemove}){
  const [savedFlash, setSavedFlash] = useState(false);
  const wc = wordCount(transcript.text);

  function handleTextChange(v){
    onChange({text: v});
    setSavedFlash(true);
    clearTimeout(handleTextChange._t);
    handleTextChange._t = setTimeout(() => setSavedFlash(false), 1000);
  }

  return (
    <div className="card" style={{padding:0, overflow:"hidden"}}>
      <div style={{display:"flex", alignItems:"center", gap:10, padding:"12px 16px", cursor:"pointer"}} onClick={onToggle}>
        <span className="badge" style={{background:"var(--purple)", color:"#fff", fontWeight:700}}>{transcript.id}</span>
        <div style={{fontWeight:600, color:"var(--text-dark)", flex:1}}>{transcript.label}</div>
        <div style={{color:"var(--text-muted)", fontSize:12}}>{wc} words</div>
        {transcript.reviewed && <span className="badge" style={{background:"var(--green-bg)", color:"var(--green)"}}>✓ Reviewed</span>}
        <span style={{transform: expanded ? "rotate(90deg)" : "rotate(0deg)", transition:"transform .2s", color:"var(--text-muted)"}}>▶</span>
        <button className="btn-sm" style={{background:"none", border:"none", color:"var(--red)", fontWeight:700}}
          onClick={e => { e.stopPropagation(); onRemove(); }}>✕</button>
      </div>

      {!expanded && (
        <div className="clamp2" style={{padding:"0 16px 14px 16px", color:"var(--text-muted)", fontSize:13}}>{transcript.text}</div>
      )}

      {expanded && (
        <div className="fade-in" style={{padding:"0 16px 16px 16px"}}>
          <textarea rows={6} style={{width:"100%"}} value={transcript.text} onChange={e => handleTextChange(e.target.value)}></textarea>
          <div style={{fontSize:11, color:"var(--text-muted)", marginTop:4, height:14}}>{savedFlash ? "Changes auto-saved" : ""}</div>
          <div style={{display:"flex", gap:8, marginTop:8}}>
            <button className={"btn btn-sm " + (transcript.reviewed ? "btn-green" : "btn-outline")}
              onClick={() => onChange({reviewed: !transcript.reviewed})}>
              {transcript.reviewed ? "✓ Reviewed" : "✓ Mark Reviewed"}
            </button>
            <button className="btn btn-sm btn-ghost" onClick={() => {
              const newLabel = prompt("Edit label:", transcript.label);
              if(newLabel) onChange({label: newLabel});
            }}>🏷 Edit Label</button>
            <button className="btn btn-sm btn-ghost" style={{color:"var(--red)"}} onClick={onRemove}>🗑 Remove</button>
          </div>
        </div>
      )}
    </div>
  );
}

        insightLoadingState={insightLoadingState}
        insightError={insightError}
      />
    );
  }

  // idle
  return (
    <div className="card fade-in" style={{textAlign:"center", padding:"56px 24px", maxWidth:520, margin:"40px auto"}}>
      <div style={{fontSize:36, color:"var(--purple)", marginBottom:10}}>🗂</div>

      <div style={{color:"var(--text-muted)", fontSize:13, marginBottom:18}}>Add your transcripts in Tab 1 and click Run AI Synthesis</div>
      <button className="btn btn-purple" onClick={onGoToTranscripts}>Go to Transcripts →</button>
    </div>

}

function LoadingBucketing({transcripts}){
  const [msgIdx, setMsgIdx] = useState(0);
  const [progress, setProgress] = useState(0);

  useEffect(() => {
    const interval = setInterval(() => setMsgIdx(i => (i + 1) % LOADING_MESSAGES.length), 2000);
    const start = Date.now();
    const progInterval = setInterval(() => {
      const elapsed = Date.now() - start;
      const pct = Math.min(90, (elapsed / 8000) * 90);
      setProgress(pct);
    }, 100);
    return () => { clearInterval(interval); clearInterval(progInterval); };
  }, []);

  const msg = LOADING_MESSAGES[msgIdx].replace("{N}", transcripts.length);

  return (
    <div className="card fade-in" style={{textAlign:"center", padding:"64px 24px", maxWidth:520, margin:"40px auto"}}>
      <div className="spinner"></div>
      <div style={{color:"var(--text-muted)", fontSize:13, marginTop:20, minHeight:20}}>{msg}</div>
      <div style={{background:"var(--border)", height:4, borderRadius:4, marginTop:20, overflow:"hidden"}}>
        <div style={{background:"var(--purple)", height:"100%", width:progress + "%", transition:"width .1s linear"}}></div>
      </div>
    </div>
  );
}

function ResultsBucketing({mode, synthesisResult, setSynthesisResult, transcripts, bucketApprovals, setBucketApprovals, onRerun, highlightParticipant, setHighlightParticipant, onGenerateInsights, insightLoadingState, insightError}){
  const [showCreateBucket, setShowCreateBucket] = useState(false);

  const totalObs = synthesisResult.buckets.reduce((s, b) => s + b.observations.length, 0);

  function updateBuckets(newBuckets){
    setSynthesisResult({...synthesisResult, buckets: newBuckets});
  }
  function updateUnclassified(newUnclassified){
    setSynthesisResult({...synthesisResult, unclassified: newUnclassified});
  }

  function toggleApprove(bucketId){
    setBucketApprovals({...bucketApprovals, [bucketId]: !bucketApprovals[bucketId]});
  }

  function createBucket(name, confidence){
    const newBucket = { id: uid(), name, insight: "Manually created bucket.", confidence, observations: [] };
    updateBuckets([...synthesisResult.buckets, newBucket]);
    setShowCreateBucket(false);
  }

  return (
    <div className="fade-in">
      <div style={{background:"var(--indigo)", borderRadius:10, padding:16, display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:14, flexWrap:"wrap", gap:10}}>
        <div>
          <div style={{color:"var(--mid-purple)", fontSize:10, fontWeight:700, letterSpacing:.5}}>
            SYNTHESIS COMPLETE {mode === "demo" && "· DEMO DATA"}
          </div>
          <div style={{color:"#fff", fontSize:14, marginTop:2}}>{synthesisResult.summary}</div>
        </div>
        <div style={{display:"flex", gap:8}}>
          <span className="badge" style={{background:"var(--purple)", color:"#fff"}}>{transcripts.length} Transcripts</span>
          <span className="badge" style={{background:"var(--purple)", color:"#fff"}}>{synthesisResult.buckets.length} Buckets</span>
          <span className="badge" style={{background:"var(--purple)", color:"#fff"}}>{synthesisResult.unclassified.length} Unclassified</span>
        </div>
      </div>

      {mode === "demo" && (
        <div style={{background:"var(--amber-bg)", borderLeft:"3px solid var(--amber)", borderRadius:6, padding:"10px 14px", fontSize:12.5, color:"#92400E", marginBottom:10}}>
          🎬 You're viewing a pre-generated sample synthesis so you can try the full workflow with no API key. Switch to Live Mode in the top bar and add your Anthropic key to synthesize your own transcripts.
        </div>
      )}

      <div style={{background:"var(--green-bg)", borderLeft:"3px solid var(--green)", borderRadius:6, padding:"10px 14px", fontSize:12.5, color:"#065F46", marginBottom:16}}>
        ✓ All AI classifications are provisional. Every bucket below is editable — approve, edit, or reassign any observation.
      </div>

      <div style={{textAlign:"right", marginBottom:10}}>
        <button className="btn btn-sm" style={{background:"var(--purple-light)", color:"var(--purple)"}} onClick={onRerun}>↺ Re-run Synthesis</button>
      </div>

      <div style={{display:"flex", justifyContent:"space-between", alignItems:"baseline", marginBottom:10}}>
        <div style={{fontSize:11, fontWeight:700, color:"var(--text-muted)", letterSpacing:.5}}>OBSERVATION BUCKETS</div>
        <div style={{fontSize:12, color:"var(--text-muted)"}}>{totalObs} total observations across {synthesisResult.buckets.length} buckets</div>
      </div>

      <div style={{display:"flex", flexDirection:"column", gap:12}}>
        {synthesisResult.buckets.map((bucket, i) => (
          <BucketCard key={bucket.id} bucket={bucket} index={i}
            allBuckets={synthesisResult.buckets}
            transcripts={transcripts}
            approved={!!bucketApprovals[bucket.id]}
            onToggleApprove={() => toggleApprove(bucket.id)}
            onUpdateBucket={patch => {
              const copy = synthesisResult.buckets.slice();
              copy[i] = {...copy[i], ...patch};
              updateBuckets(copy);
            }}
            onMoveObservation={(obsId, targetBucketId) => {
              const copy = synthesisResult.buckets.map(b => ({...b, observations: b.observations.slice()}));
              const srcIdx = copy.findIndex(b => b.id === bucket.id);
              const obsIdx = copy[srcIdx].observations.findIndex(o => o.id === obsId);
              const [obs] = copy[srcIdx].observations.splice(obsIdx, 1);
              const targetIdx = copy.findIndex(b => b.id === targetBucketId);
              copy[targetIdx].observations.push(obs);
              updateBuckets(copy);
            }}
            highlightParticipant={highlightParticipant}
          />
        ))}
      </div>

      {synthesisResult.unclassified.length > 0 && (
        <UnclassifiedBucket
          unclassified={synthesisResult.unclassified}
          buckets={synthesisResult.buckets}
          onAssign={(obsId, targetBucketId) => {
            const obsIdx = synthesisResult.unclassified.findIndex(o => o.id === obsId);
            const obs = synthesisResult.unclassified[obsIdx];
            const newUnclassified = synthesisResult.unclassified.filter(o => o.id !== obsId);
            const newBuckets = synthesisResult.buckets.map(b => b.id === targetBucketId
              ? {...b, observations: [...b.observations, {id: obs.id, participantId: obs.participantId, observation: obs.observation, flag: "standard"}]}
              : b);
            setSynthesisResult({...synthesisResult, unclassified: newUnclassified, buckets: newBuckets});
          }}
        />
      )}

      <div style={{marginTop:16}}>
        {!showCreateBucket ? (
          <button className="btn btn-outline" onClick={() => setShowCreateBucket(true)}>+ Create new bucket manually</button>
        ) : (
          <CreateBucketForm onCreate={createBucket} onCancel={() => setShowCreateBucket(false)} />
        )}
      </div>

      <GenerateInsightsPanel
        synthesisResult={synthesisResult}
        bucketApprovals={bucketApprovals}
        onGenerateInsights={onGenerateInsights}
        insightLoadingState={insightLoadingState}
        insightError={insightError}
      />
    </div>
  );
}

function countAndIndexForParticipant(allBuckets, targetObs){
  // gather all observations across buckets for this participant, in encounter order
  const list = [];
  allBuckets.forEach(b => b.observations.forEach(o => { if(o.participantId === targetObs.participantId) list.push(o.id); }));
  const idx = list.indexOf(targetObs.id);
  return { index: idx < 0 ? 0 : idx, total: list.length || 1 };
}

function estimateTimestamp(transcript, index, total){
  if(!transcript) return "~0m 00s";
  const wc = wordCount(transcript.text);
  const minutes = ((index + 1) / total) * (wc / 130);
  const totalSeconds = Math.max(0, Math.round(minutes * 60));
  const m = Math.floor(totalSeconds / 60);
  const s = totalSeconds % 60;
  return `~${m}m ${s.toString().padStart(2, "0")}s`;
}

function StrategicInsightsList({synthesisResult, acceptedInsights, setAcceptedInsights, dismissedInsights, setDismissedInsights, setActiveTab, setHighlightParticipant}){
  // local state copy for editing text, kept in synthesisResult.strategicInsights directly via mutation trick
  const [, forceRender] = useState(0);
  const [showAddForm, setShowAddForm] = useState(false);

  function patchInsight(idx, patch){
    synthesisResult.strategicInsights[idx] = {...synthesisResult.strategicInsights[idx], ...patch};
    forceRender(n => n + 1);
  }

  function addManualInsight(text, type, evidence){
    synthesisResult.strategicInsights.push({id: uid(), insight: text, type, evidence});
    forceRender(n => n + 1);
    setShowAddForm(false);
  }

  // figure out supporting participants per insight: find participant IDs mentioned in evidence text or fallback to all
  function supportingParticipants(insight){
    const ids = new Set();
    synthesisResult.buckets.forEach(b => b.observations.forEach(o => {
      if(insight.evidence && insight.evidence.includes(o.participantId)) ids.add(o.participantId);
    }));
    if(ids.size === 0){
      // fallback: all participant ids referenced anywhere in evidence via regex P\d+
      const matches = (insight.evidence || "").match(/P\d+/g) || [];
      matches.forEach(m => ids.add(m));
    }
    return Array.from(ids);
  }

  return (
    <div style={{display:"flex", flexDirection:"column", gap:12}}>
      {synthesisResult.strategicInsights.map((insight, idx) => {
        if(dismissedInsights[insight.id]) return null;
        const meta = INSIGHT_TYPE_META[insight.type] || INSIGHT_TYPE_META.pattern;
        const accepted = !!acceptedInsights[insight.id];
        const participants = supportingParticipants(insight);
        return (
          <div key={insight.id} className="card" style={{background:"var(--green-bg)", borderLeft:"3px solid var(--green)", borderColor:"var(--green-bg)"}}>
            <div style={{display:"flex", alignItems:"flex-start", gap:10}}>
              <span style={{fontSize:18}}>💡</span>
              <div style={{flex:1}}>
                <EditableInsightText insight={insight} onChange={v => patchInsight(idx, {insight: v})} />
              </div>
              <span className="badge" style={{background:meta.bg, color:meta.color}}>{meta.label}</span>
            </div>
            <EditableEvidenceText insight={insight} onChange={v => patchInsight(idx, {evidence: v})} />

            {participants.length > 0 && (
              <div style={{display:"flex", gap:6, marginTop:10, flexWrap:"wrap"}}>
                {participants.map(pid => (
                  <ParticipantBadge key={pid} id={pid} onClick={() => { setHighlightParticipant(pid); setActiveTab("bucketing"); }} />
                ))}
              </div>
            )}

            <div style={{display:"flex", gap:8, marginTop:12}}>
              <button className={"btn btn-sm " + (accepted ? "btn-green" : "btn-outline")}
                onClick={() => setAcceptedInsights({...acceptedInsights, [insight.id]: !accepted})}>
                {accepted ? "✓ Accepted" : "✓ Accept Insight"}
              </button>
              <button className="btn btn-sm btn-ghost" onClick={() => setDismissedInsights({...dismissedInsights, [insight.id]: true})}>✗ Dismiss</button>
            </div>
          </div>
        );
      })}

      {!showAddForm ? (
        <a onClick={() => setShowAddForm(true)} style={{fontSize:13}}>+ Add manual insight</a>
      ) : (
        <ManualInsightForm onAdd={addManualInsight} onCancel={() => setShowAddForm(false)} />
      )}
    </div>
  );
}

function EditableInsightText({insight, onChange}){
  const [editing, setEditing] = useState(false);
  if(editing){
    return <input type="text" autoFocus value={insight.insight} onChange={e => onChange(e.target.value)}
      onBlur={() => setEditing(false)} onKeyDown={e => e.key === "Enter" && setEditing(false)}
      style={{width:"100%", fontWeight:700}} />;
  }
  return <div onClick={() => setEditing(true)} style={{fontWeight:700, color:"var(--text-dark)", cursor:"text", fontSize:14}}>{insight.insight}</div>;
}
function EditableEvidenceText({insight, onChange}){
  const [editing, setEditing] = useState(false);
  if(editing){
    return <textarea autoFocus rows={2} value={insight.evidence} onChange={e => onChange(e.target.value)}
      onBlur={() => setEditing(false)} style={{width:"100%", marginTop:6, fontSize:12}}></textarea>;
  }
  return <div onClick={() => setEditing(true)} style={{color:"var(--text-muted)", fontSize:12.5, marginTop:6, cursor:"text"}}>{insight.evidence}</div>;
}

function ManualInsightForm({onAdd, onCancel}){
  const [text, setText] = useState("");
  const [type, setType] = useState("pattern");
  const [evidence, setEvidence] = useState("");
  return (
    <div className="card">
      <input type="text" placeholder="Insight text" value={text} onChange={e => setText(e.target.value)} style={{width:"100%", marginBottom:8}} />
      <div style={{display:"flex", gap:8, marginBottom:8}}>
        <select value={type} onChange={e => setType(e.target.value)} style={{padding:"6px 8px", borderRadius:6, border:"1px solid var(--border)"}}>
          {Object.keys(INSIGHT_TYPE_META).map(k => <option key={k} value={k}>{INSIGHT_TYPE_META[k].label}</option>)}
        </select>
      </div>
      <textarea rows={2} placeholder="Evidence notes (mention participant IDs like P01, P02)" value={evidence} onChange={e => setEvidence(e.target.value)} style={{width:"100%", marginBottom:8}}></textarea>
      <div style={{display:"flex", gap:6}}>
        <button className="btn btn-sm btn-purple" onClick={() => text.trim() && onAdd(text.trim(), type, evidence.trim())}>Add Insight</button>
        <button className="btn btn-sm btn-ghost" onClick={onCancel}>Cancel</button>
      </div>
    </div>
  );
}

function ApprovedInsightsSummary({synthesisResult, acceptedInsights}){
  const accepted = synthesisResult.strategicInsights.filter(i => acceptedInsights[i.id]);

  function exportSummary(){
    const text = "APPROVED INSIGHTS\n\n" + accepted.map((i, idx) => `${idx + 1}. ${i.insight}\n   Evidence: ${i.evidence}`).join("\n\n");
    navigator.clipboard && navigator.clipboard.writeText(text).catch(() => {});
    alert("Approved insights copied to clipboard.");
  }

  return (
    <div className="card" style={{marginTop:16, background:"var(--surface)"}}>
      <div style={{display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:10}}>
        <div style={{fontSize:11, fontWeight:700, color:"var(--text-muted)", letterSpacing:.5}}>APPROVED INSIGHTS ({accepted.length})</div>
        <button className="btn btn-sm btn-outline" onClick={exportSummary}>Export Summary</button>
      </div>
      <ol style={{margin:0, paddingLeft:18}}>
        {accepted.map(i => <li key={i.id} style={{fontSize:13, color:"var(--text-dark)", marginBottom:4}}>{i.insight}</li>)}
      </ol>
    </div>
  );
}

/* ------------------------------ CHARTS (SVG) ------------------------------ */

function ChartsView({synthesisResult, transcripts}){
  return (
    <div style={{display:"flex", flexDirection:"column", gap:16}}>
      <ObservationsPerParticipantChart synthesisResult={synthesisResult} transcripts={transcripts} />
      <BucketConfidenceChart synthesisResult={synthesisResult} />
      <FlagDistributionChart synthesisResult={synthesisResult} />
    </div>
  );
}

function ObservationsPerParticipantChart({synthesisResult, transcripts}){
  const [hover, setHover] = useState(null);
  const counts = transcripts.map(t => {
    let c = 0;
    synthesisResult.buckets.forEach(b => b.observations.forEach(o => { if(o.participantId === t.id) c++; }));
    return { id: t.id, count: c };
  });
  const max = Math.max(1, ...counts.map(c => c.count));
  const W = 700, H = 220, padL = 40, padB = 30, padT = 20, padR = 20;
  const chartW = W - padL - padR, chartH = H - padT - padB;
  const barW = chartW / counts.length * 0.6;
  const gap = chartW / counts.length;

  return (
    <div className="card">
      <div style={{fontWeight:700, fontSize:14, color:"var(--text-dark)", marginBottom:10}}>Observations per Participant</div>
      <svg viewBox={`0 0 ${W} ${H}`} width="100%" style={{maxWidth:750, display:"block"}}>
        <line x1={padL} y1={padT} x2={padL} y2={H - padB} stroke="#E5E7EB" />
        <line x1={padL} y1={H - padB} x2={W - padR} y2={H - padB} stroke="#E5E7EB" />
        {[0, 0.5, 1].map((f, i) => (
          <text key={i} x={padL - 8} y={H - padB - f * chartH + 4} fontSize="10" fill="#6B7280" textAnchor="end">{Math.round(max * f)}</text>
        ))}
        {counts.map((c, i) => {
          const x = padL + i * gap + (gap - barW) / 2;
          const h = (c.count / max) * chartH;
          const y = H - padB - h;
          return (
            <g key={c.id} onMouseEnter={() => setHover(i)} onMouseLeave={() => setHover(null)}>
              <rect x={x} y={y} width={barW} height={h} fill="#534AB7" rx="3" opacity={hover === i ? 1 : 0.85} />
              <text x={x + barW / 2} y={H - padB + 16} fontSize="10" fill="#6B7280" textAnchor="middle">{c.id}</text>
              {hover === i && <text x={x + barW / 2} y={y - 6} fontSize="11" fill="#111827" textAnchor="middle" fontWeight="700">{c.count}</text>}
            </g>
          );
        })}
      </svg>
    </div>
  );
}

function BucketConfidenceChart({synthesisResult}){
  const W = 700, rowH = 34, padL = 200, padR = 60, padTop = 10;
  const max = Math.max(1, ...synthesisResult.buckets.map(b => b.observations.length));
  const chartW = W - padL - padR;
  const H = padTop * 2 + rowH * synthesisResult.buckets.length;

  return (
    <div className="card">
      <div style={{fontWeight:700, fontSize:14, color:"var(--text-dark)", marginBottom:10}}>Bucket Size and Confidence</div>
      <svg viewBox={`0 0 ${W} ${H}`} width="100%" style={{maxWidth:750, display:"block"}}>
        {synthesisResult.buckets.map((b, i) => {
          const y = padTop + i * rowH;
          const w = (b.observations.length / max) * chartW;
          const color = CONFIDENCE_META[b.confidence] ? CONFIDENCE_META[b.confidence].color : "#6B7280";
          return (
            <g key={b.id}>
              <text x={padL - 10} y={y + rowH / 2 + 4} fontSize="11" fill="#374151" textAnchor="end">{b.name.length > 26 ? b.name.slice(0,24)+"…" : b.name}</text>
              <rect x={padL} y={y + 6} width={Math.max(2,w)} height={rowH - 14} fill={color} rx="3" />
              <text x={padL + w + 8} y={y + rowH / 2 + 4} fontSize="11" fill="#111827" fontWeight="700">{b.observations.length}</text>
            </g>
          );
        })}
      </svg>
    </div>
  );
}

function FlagDistributionChart({synthesisResult}){
  const counts = { critical: 0, noteworthy: 0, unique: 0, standard: 0 };
  synthesisResult.buckets.forEach(b => b.observations.forEach(o => { counts[o.flag] = (counts[o.flag] || 0) + 1; }));
  const total = Object.values(counts).reduce((a, b) => a + b, 0) || 1;
  const colors = { critical: "#DC2626", noteworthy: "#D97706", unique: "#1D4ED8", standard: "#9CA3AF" };

  const cx = 110, cy = 110, r = 80, innerR = 46;
  let angle = -90;
  const segments = Object.keys(counts).map(k => {
    const val = counts[k];
    const frac = val / total;
    const startAngle = angle;
    const endAngle = angle + frac * 360;
    angle = endAngle;
    return { key: k, val, startAngle, endAngle, color: colors[k] };
  });

  function polar(cx, cy, r, angleDeg){
    const a = (angleDeg - 90) * Math.PI / 180;
    return [cx + r * Math.cos(a), cy + r * Math.sin(a)];
  }
  function arcPath(seg){
    if(seg.val === 0) return "";
    const [x1, y1] = polar(cx, cy, r, seg.startAngle + 90);
    const [x2, y2] = polar(cx, cy, r, seg.endAngle + 90);
    const [ix1, iy1] = polar(cx, cy, innerR, seg.startAngle + 90);
    const [ix2, iy2] = polar(cx, cy, innerR, seg.endAngle + 90);
    const large = (seg.endAngle - seg.startAngle) > 180 ? 1 : 0;
    return `M ${ix1} ${iy1} L ${x1} ${y1} A ${r} ${r} 0 ${large} 1 ${x2} ${y2} L ${ix2} ${iy2} A ${innerR} ${innerR} 0 ${large} 0 ${ix1} ${iy1} Z`;
  }

  return (
    <div className="card">
      <div style={{fontWeight:700, fontSize:14, color:"var(--text-dark)", marginBottom:10}}>Observation Importance Distribution</div>
      <div style={{display:"flex", alignItems:"center", gap:32, flexWrap:"wrap"}}>
        <svg width="220" height="220" viewBox="0 0 220 220">
          {segments.map(seg => seg.val > 0 && <path key={seg.key} d={arcPath(seg)} fill={seg.color} />)}
          <text x={cx} y={cy - 4} textAnchor="middle" fontSize="20" fontWeight="700" fill="#111827">{total}</text>
          <text x={cx} y={cy + 14} textAnchor="middle" fontSize="10" fill="#6B7280">observations</text>
        </svg>
        <div>
          {Object.keys(counts).map(k => (
            <div key={k} style={{display:"flex", alignItems:"center", gap:8, marginBottom:6}}>
              <span style={{width:10, height:10, borderRadius:3, background:colors[k], display:"inline-block"}}></span>
              <span style={{fontSize:12, color:"var(--text-body)", textTransform:"capitalize"}}>{k}</span>
              <span style={{fontSize:12, color:"var(--text-muted)"}}>({counts[k]})</span>
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

/* ----------------------------- DIAGRAMS (SVG) ----------------------------- */

function DiagramView({synthesisResult, transcripts}){
  return (
    <div style={{display:"flex", flexDirection:"column", gap:16}}>
      <AffinityClusterDiagram synthesisResult={synthesisResult} />
      <ObservationFlowDiagram synthesisResult={synthesisResult} transcripts={transcripts} />
    </div>
  );
}

function AffinityClusterDiagram({synthesisResult}){
  const W = 750, H = 520;
  const cx = W / 2, cy = H / 2;
  const n = synthesisResult.buckets.length;
  const radius = 190;
  const boxW = 150, boxH = 54;

  const positions = synthesisResult.buckets.map((b, i) => {
    const angle = (i / n) * 2 * Math.PI - Math.PI / 2;
    return { x: cx + radius * Math.cos(angle), y: cy + radius * Math.sin(angle), bucket: b };
  });

  return (
    <div className="card" style={{overflowX:"auto"}}>
      <div style={{fontWeight:700, fontSize:14, color:"var(--text-dark)", marginBottom:10}}>Affinity Cluster Diagram</div>
      <svg width={W} height={H} viewBox={`0 0 ${W} ${H}`} style={{minWidth:750}}>
        {positions.map((p, i) => (
          <line key={i} x1={cx} y1={cy} x2={p.x} y2={p.y} stroke="#C7D2FE" strokeWidth={Math.max(1, Math.min(6, p.bucket.observations.length))} />
        ))}
        <circle cx={cx} cy={cy} r="56" fill="#1E1B4B" />
        <text x={cx} y={cy - 4} textAnchor="middle" fill="#fff" fontSize="12" fontWeight="700">Research</text>
        <text x={cx} y={cy + 12} textAnchor="middle" fill="#fff" fontSize="12" fontWeight="700">Synthesis</text>

        {positions.map((p, i) => {
          const conf = CONFIDENCE_META[p.bucket.confidence] || CONFIDENCE_META.medium;
          const participantIds = Array.from(new Set(p.bucket.observations.map(o => o.participantId)));
          return (
            <g key={p.bucket.id}>
              <rect x={p.x - boxW/2} y={p.y - boxH/2} width={boxW} height={boxH} rx="10" fill="#534AB7" />
              <text x={p.x} y={p.y - 6} textAnchor="middle" fill="#fff" fontSize="11" fontWeight="700">
                {p.bucket.name.length > 22 ? p.bucket.name.slice(0,20)+"…" : p.bucket.name}
              </text>
              <text x={p.x} y={p.y + 12} textAnchor="middle" fill={conf.bg} fontSize="9">{conf.label} confidence</text>
              {participantIds.slice(0,4).map((pid, j) => (
                <text key={pid} x={p.x - boxW/2 + 8 + j*24} y={p.y + boxH/2 + 14} fontSize="9" fill="#534AB7" fontWeight="700">{pid}</text>
              ))}
            </g>
          );
        })}
      </svg>
    </div>
  );
}

function ObservationFlowDiagram({synthesisResult, transcripts}){
  const W = 750;
  const rowH = 30;
  const leftX = 20, leftW = 90;
  const rightX = W - 200, rightW = 180;
  const H = Math.max(transcripts.length, synthesisResult.buckets.length) * rowH + 40;

  const leftPositions = {};
  transcripts.forEach((t, i) => leftPositions[t.id] = 30 + i * rowH);

  const rightPositions = {};
  synthesisResult.buckets.forEach((b, i) => rightPositions[b.id] = 30 + i * (H / synthesisResult.buckets.length));

  const links = [];
  synthesisResult.buckets.forEach(b => {
    const seen = new Set();
    b.observations.forEach(o => {
      const key = o.participantId + "->" + b.id;
      if(!seen.has(key) && leftPositions[o.participantId] !== undefined){
        seen.add(key);
        links.push({ from: leftPositions[o.participantId], to: rightPositions[b.id] });
      }
    });
  });

  return (
    <div className="card" style={{overflowX:"auto"}}>
      <div style={{fontWeight:700, fontSize:14, color:"var(--text-dark)", marginBottom:10}}>Observation Flow Diagram</div>
      <svg width={W} height={H} viewBox={`0 0 ${W} ${H}`} style={{minWidth:750}}>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
            <path d="M0,0 L6,3 L0,6 Z" fill="#A5B4FC" />
          </marker>
        </defs>
        {links.map((l, i) => (
          <path key={i} d={`M ${leftX + leftW} ${l.from} C ${(leftX+leftW+rightX)/2} ${l.from}, ${(leftX+leftW+rightX)/2} ${l.to}, ${rightX} ${l.to}`}
            fill="none" stroke="#A5B4FC" strokeWidth="1.4" markerEnd="url(#arrow)" opacity="0.8" />
        ))}
        {transcripts.map(t => (
          <g key={t.id}>
            <rect x={leftX} y={leftPositions[t.id] - 12} width={leftW} height={24} rx="6" fill="#EEF2FF" stroke="#C7D2FE" />
            <text x={leftX + leftW/2} y={leftPositions[t.id] + 4} textAnchor="middle" fontSize="11" fontWeight="700" fill="#534AB7">{t.id}</text>
          </g>
        ))}
        {synthesisResult.buckets.map(b => {
          const conf = CONFIDENCE_META[b.confidence] || CONFIDENCE_META.medium;
          return (
            <g key={b.id}>
              <rect x={rightX} y={rightPositions[b.id] - 15} width={rightW} height={30} rx="8" fill="#534AB7" />
              <text x={rightX + rightW/2} y={rightPositions[b.id] - 1} textAnchor="middle" fontSize="10" fontWeight="700" fill="#fff">
                {b.name.length > 24 ? b.name.slice(0,22)+"…" : b.name}
              </text>
              <text x={rightX + rightW/2} y={rightPositions[b.id] + 11} textAnchor="middle" fontSize="8" fill={conf.bg}>{conf.label}</text>
            </g>
          );
        })}
      </svg>
    </div>
  );
}
